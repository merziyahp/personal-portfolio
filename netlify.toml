[build]
  command = "cd client && npm ci && npm run build"   # or: npm install && npm run build
  publish = "client/dist"
  
[[redirects]]
from = "/apply"
to = "/?utm_source=jobapp&utm_medium=application&utm_campaign=portfolio"
status = 302

[[redirects]]
from = "/resume"
to = "/?utm_source=resume&utm_medium=pdf&utm_campaign=portfolio"
status = 302

[[redirects]]
from = "/linkedin"
to = "/?utm_source=linkedin&utm_medium=social&utm_campaign=portfolio"
status = 302

# SPA fallback for client-side routing
# this should go after the above campaign redirects so that it doesn't overwrite those rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
